services:

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
      ZOOKEEPER_SYNC_LIMIT: ${ZOOKEEPER_SYNC_LIMIT:-2}
    ports:
      - "2181:2181"
    volumes:
      - ${ZOOKEEPER_DATA_PATH}:/var/lib/zookeeper/data
      - ${ZOOKEEPER_LOG_PATH}:/var/lib/zookeeper/log
    networks:
      - spark-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - ${KAFKA_DATA_PATH}:/var/lib/kafka/data
    networks:
      - spark-network

  # Spark Master
  spark-master:
    container_name: spark-master
    image: spark-local:3.5.0
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - SPARK_MASTER_WEBUI_PORT=9090
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9090:9090"
    volumes:
      - ${APP_SRC_PATH}:/opt/bitnami/spark/jobs/src
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
      - ${APP_LOG_PATH}:/opt/bitnami/spark/logs/events
      - ${APP_METRICS_PATH}:/opt/bitnami/spark/metrics
    networks:
      - spark-network

  # Spark Workers
  spark-worker-1:
    container_name: spark-worker-1
    image: spark-local:3.5.0
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ${APP_SRC_PATH}:/opt/bitnami/spark/jobs/src
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
      - ${APP_LOG_PATH}:/opt/bitnami/spark/logs/events
      - ${APP_METRICS_PATH}:/opt/bitnami/spark/metrics
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-2:
    container_name: spark-worker-2
    image: spark-local:3.5.0
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ${APP_SRC_PATH}:/opt/bitnami/spark/jobs/src
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
      - ${APP_LOG_PATH}:/opt/bitnami/spark/logs/events
      - ${APP_METRICS_PATH}:/opt/bitnami/spark/metrics
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-3:
    container_name: spark-worker-3
    image: spark-local:3.5.0
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ${APP_SRC_PATH}:/opt/bitnami/spark/jobs/src
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
      - ${APP_LOG_PATH}:/opt/bitnami/spark/logs/events
      - ${APP_METRICS_PATH}:/opt/bitnami/spark/metrics
    depends_on:
      - spark-master
    networks:
      - spark-network

  # Spark History Server
  spark-history-server:
    container_name: spark-history-server
    image: spark-history-server-local:3.5.0
    user: root
    environment:
      - SPARK_HISTORY_UI_PORT=18080
      - SPARK_DAEMON_MEMORY=5g
      - SPARK_HISTORY_RETAINEDAPPLICATIONS=100
      - SPARK_HISTORY_UI_MAXAPPLICATIONS=50
      - SPARK_HISTORY_STORE_MAXDISKUSAGE=20g
      - SPARK_HISTORY_FS_LOG_DIRECTORY=/opt/bitnami/spark/logs/events
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/opt/bitnami/spark/logs/events
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
    ports:
      - 18080:18080
      - 4040:4040
    volumes:
      - ${APP_LOG_PATH}:/opt/bitnami/spark/logs/events
      - ${APP_METRICS_PATH}:/opt/bitnami/spark/metrics
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
    networks:
      - spark-network

  # Event Producer - Generates game events to Kafka
  event-producer:
    build:
      context: ..
      dockerfile: build/Dockerfile.producer
    container_name: event-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      INIT_TOPIC: ${INIT_TOPIC:-init_events}
      MATCH_TOPIC: ${MATCH_TOPIC:-match_events}
      PURCHASE_TOPIC: ${PURCHASE_TOPIC:-purchase_events}
      EVENT_RATE_PER_SECOND: ${EVENT_RATE_PER_SECOND:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_DIR: ${SCHEMA_DIR:-schemas}
    depends_on:
      - kafka
    networks:
      - spark-network
    volumes:
      - ../src:/src/src
      - ../schemas:/src/schemas

  # Bronze Ingestion - Init Events
  bronze-ingestion-init:
    image: spark-local:3.5.0
    container_name: bronze-ingestion-init
    user: root
    command: >
      spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      /opt/bitnami/spark/jobs/src/ingestion/main.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=init_events
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - DELTA_AUTO_COMPACT=false
    volumes:
      - ${APP_ROOT_PATH}:/opt/bitnami/spark/jobs
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - kafka
      - event-producer
    networks:
      - spark-network
    restart: unless-stopped

  # Bronze Ingestion - Match Events
  bronze-ingestion-match:
    image: spark-local:3.5.0
    container_name: bronze-ingestion-match
    user: root
    command: >
      spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      /opt/bitnami/spark/jobs/src/ingestion/main.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=match_events
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - DELTA_AUTO_COMPACT=false
    volumes:
      - ${APP_ROOT_PATH}:/opt/bitnami/spark/jobs
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - kafka
      - event-producer
    networks:
      - spark-network
    restart: unless-stopped

  # Bronze Ingestion - Purchase Events
  bronze-ingestion-purchase:
    image: spark-local:3.5.0
    container_name: bronze-ingestion-purchase
    user: root
    command: >
      spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      /opt/bitnami/spark/jobs/src/ingestion/main.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=purchase_events
      - PYTHONPATH=/opt/bitnami/spark/jobs
      - DELTA_AUTO_COMPACT=false
    volumes:
      - ${APP_ROOT_PATH}:/opt/bitnami/spark/jobs
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - kafka
      - event-producer
    networks:
      - spark-network
    restart: unless-stopped

  # Data Quality - Bronze to Silver transformation
  data-quality:
    image: spark-local:3.5.0
    container_name: data-quality
    command: >
      spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      /opt/bitnami/spark/jobs/src/data_quality/main.py
    environment:
      - PYTHONPATH=/opt/bitnami/spark/jobs
    volumes:
      - ${APP_ROOT_PATH}:/opt/bitnami/spark/jobs
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - bronze-ingestion-init
      - bronze-ingestion-match
      - bronze-ingestion-purchase
    networks:
      - spark-network
    restart: unless-stopped

  # Real-Time Aggregation - Silver to Gold (minute-level metrics)
  realtime-aggregation:
    image: spark-local:3.5.0
    container_name: realtime-aggregation
    command: >
      spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      /opt/bitnami/spark/jobs/src/aggregation/realtime/main.py
    environment:
      - PYTHONPATH=/opt/bitnami/spark/jobs
    volumes:
      - ${APP_ROOT_PATH}:/opt/bitnami/spark/jobs
      - ${APP_STORAGE_PATH}:/opt/bitnami/spark/storage
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - data-quality
    networks:
      - spark-network
    restart: unless-stopped

networks:
  spark-network:
    driver: bridge

